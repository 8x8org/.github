name: 📝 Documentation improvement
description: Report unclear, missing, or incorrect public documentation
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document / page
      placeholder: "README.md, ARCHITECTURE.md, a specific section, ..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, missing, or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: My suggestion does not request or expose private-system details.
          required: true
