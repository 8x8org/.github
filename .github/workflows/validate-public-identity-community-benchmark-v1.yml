name: Validate Public Identity Community Benchmark V1

on:
  pull_request:
    paths:
      - 'profile/README.md'
      - 'docs/8X8_PUBLIC_COMPETITION_RACE_REGISTRY_0.0.1.md'
      - 'docs/8X8_EVIDENCE_BENCHMARK_AND_RANK_PROGRAM_V1.md'
      - 'docs/8X8_COMMUNITY_SOCIAL_REFERRAL_AND_PROJECT_GRAPH_V1.md'
      - 'registry/8x8-repository-identity-and-description-plan-v1.json'
      - 'registry/8x8-repository-identity-public-safe-v2.json'
      - 'registry/8x8-connected-repositories-0.0.1.json'
      - 'registry/8x8-connected-repositories-public-safe-v2.json'
      - 'registry/public-program-evidence-cards-v1.json'
      - 'scripts/repair_public_program_project_v2.sh'
      - '.github/workflows/validate-public-identity-community-benchmark-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON registries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy_plan = json.loads(Path('registry/8x8-repository-identity-and-description-plan-v1.json').read_text())
          public_plan = json.loads(Path('registry/8x8-repository-identity-public-safe-v2.json').read_text())
          legacy_connected = json.loads(Path('registry/8x8-connected-repositories-0.0.1.json').read_text())
          public_connected = json.loads(Path('registry/8x8-connected-repositories-public-safe-v2.json').read_text())
          cards = json.loads(Path('registry/public-program-evidence-cards-v1.json').read_text())

          root = 'fabric://8x8/core'
          assert legacy_plan['canonical_root'] == root
          assert legacy_plan['state'] == 'PAST_PRESERVED_SUPERSEDED_CURRENT_VIEW'
          assert legacy_plan['superseded_by'] == 'registry/8x8-repository-identity-public-safe-v2.json'
          assert legacy_plan['connected_denominator'] == {
              'total': 16,
              'public': 5,
              'private': 11,
              'private_names': 'REDACTED_FROM_CURRENT_PUBLIC_PROJECTION',
          }

          assert public_plan['schema'] == '8x8.repository-identity.public-safe.v2'
          assert public_plan['canonical_root'] == root
          public_repos = public_plan['public_repositories']
          public_ids = [r['repository'] for r in public_repos]
          assert len(public_ids) == 5
          assert len(public_ids) == len(set(public_ids))
          assert all(r['rename_action'] for r in public_repos)
          assert all(r['desired_description'] for r in public_repos)
          assert public_plan['private_repository_policy']['count'] == 11
          assert public_plan['private_repository_policy']['names'] == 'REDACTED_FROM_PUBLIC_PLAN'

          assert legacy_connected['canonical_root'] == root
          assert legacy_connected['state'] == 'PAST_PRESERVED_SUPERSEDED_CURRENT_VIEW'
          assert legacy_connected['superseded_by'] == 'registry/8x8-connected-repositories-public-safe-v2.json'
          assert legacy_connected['public_truth']['connected_repository_total'] == 16
          assert legacy_connected['public_truth']['public_repository_total'] == 5
          assert legacy_connected['public_truth']['private_repository_total'] == 11
          assert legacy_connected['public_truth']['private_repository_names'] == 'REDACTED_FROM_CURRENT_PUBLIC_PROJECTION'

          assert public_connected['schema'] == '8x8.connected-repositories.public-safe.v2'
          assert public_connected['canonical_root'] == root
          assert public_connected['connected_denominator'] == {'total': 16, 'public': 5, 'private': 11}
          connected_public_ids = [r['repository'] for r in public_connected['public_repositories']]
          assert len(connected_public_ids) == 5
          assert len(connected_public_ids) == len(set(connected_public_ids))
          assert set(connected_public_ids) == set(public_ids)
          assert public_connected['private_repository_projection']['count'] == 11
          assert public_connected['private_repository_projection']['names'] == 'REDACTED'

          # Fail closed if current public-safe V2 projections leak known private topology.
          public_v2_text = (
              Path('registry/8x8-repository-identity-public-safe-v2.json').read_text()
              + '\n'
              + Path('registry/8x8-connected-repositories-public-safe-v2.json').read_text()
          )
          forbidden_private_names = [
              'horbolsi/8x8-memory',
              'horbolsi/8x8-messages',
              'horbolsi/8x8-os-private',
              'horbolsi/8x8-os-backup',
              'horbolsi/8x8-os-hub',
              'horbolsi/8x8-os-june2026',
              'horbolsi/8x8-OS-unified',
              'horbolsi/flash-hermes-sync-safe',
              'horbolsi/8x8-blockchain',
              '8x8org/8x8-venture-operator',
          ]
          leaked = [name for name in forbidden_private_names if name in public_v2_text]
          assert not leaked, f'PRIVATE_TOPOLOGY_LEAK={leaked}'

          assert cards['schema'] == '8x8.public-program-evidence-cards.v1'
          assert cards['canonical_root'] == root
          assert cards['organization'] == '8x8org'
          assert cards['project_number'] == 1
          issues = [c['issue'] for c in cards['cards']]
          assert len(issues) == len(set(issues))
          assert {9,10,11,12,13,24,25,26,27,28}.issubset(set(issues))
          assert all(isinstance(c['desired_project_presence'], bool) for c in cards['cards'])

          print(f'PUBLIC_REPOSITORY_IDENTITY_V2=PASS public={len(public_ids)} private_redacted=11 total=16')
          print(f'PUBLIC_PROGRAM_CARDS=PASS cards={len(issues)} unique={len(set(issues))}')
          print('PRIVATE_TOPOLOGY_CURRENT_V2=REDACTED_PASS')
          PY

      - name: Validate Project-v2 repair script syntax and registry binding
        run: |
          bash -n scripts/repair_public_program_project_v2.sh
          grep -F 'public-program-evidence-cards-v1.json' scripts/repair_public_program_project_v2.sh >/dev/null
          grep -F 'schema_version:"1.4"' scripts/repair_public_program_project_v2.sh >/dev/null
          echo 'PROJECT_REPAIR_STATIC_GATE=PASS'

      - name: Validate public truth language
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('profile/README.md').read_text()
          benchmark = Path('docs/8X8_EVIDENCE_BENCHMARK_AND_RANK_PROGRAM_V1.md').read_text()
          community = Path('docs/8X8_COMMUNITY_SOCIAL_REFERRAL_AND_PROJECT_GRAPH_V1.md').read_text()
          competition = Path('docs/8X8_PUBLIC_COMPETITION_RACE_REGISTRY_0.0.1.md').read_text()

          assert '©️8x8 by FlashTM8 ⚡️🌎🤖' in profile
          assert 'fabric://8x8/core' in profile
          assert 'ONE_INTERFACE_MULTI_AUTHORITY_PROJECTION' in profile
          assert 'UNMEASURED_PENDING_DENOMINATOR' in benchmark
          assert 'RUNTIME_FUTURE_GATED' in community
          assert 'RESULT_UNVERIFIED' in competition
          assert 'PROJECT_ATTACHMENT_PENDING' in competition
          print('PUBLIC_TRUTH_LANGUAGE=PASS')
          PY
